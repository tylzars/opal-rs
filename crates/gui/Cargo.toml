[package]
name = "opal-gui"
description = "Control panel for the opal-rs camera service"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opal-rs-gui"
path = "src/main.rs"

[dependencies]
opal-ipc = { path = "../ipc" }
eframe = "0.36.2"
opal-effects = { path = "../effects" }

[target.'cfg(unix)'.dependencies]
opal-v4l2 = { path = "../v4l2" }
