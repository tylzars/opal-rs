[package]
name = "opal-setup"
description = "Windows installer for opal-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "opal-rs-setup"
path = "src/main.rs"

[features]
# Builds the four programs into the installer, from the folder named by OPAL_RS_PAYLOAD at build time.
payload = []

[target.'cfg(windows)'.dependencies]
opal-ipc = { path = "../ipc" }
opal-vcam = { path = "../vcam" }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
