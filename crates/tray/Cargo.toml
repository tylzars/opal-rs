[package]
name = "opal-tray"
description = "Tray icon for the opal-rs camera service"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opal-rs-tray"
path = "src/main.rs"

[dependencies]
opal-ipc = { version = "0.1.0", path = "../ipc" }
ksni = { version = "0.3.6", features = ["blocking"] }
