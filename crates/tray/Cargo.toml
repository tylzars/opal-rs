[package]
name = "opal-tray"
description = "Tray icon for the opal-rs camera service"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opal-rs-tray"
path = "src/main.rs"

[dependencies]
opal-ipc = { path = "../ipc" }

[target.'cfg(unix)'.dependencies]
ksni = { version = "0.3.6", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
