[package]
name = "opal-rs"
description = "Opal C1 tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opal-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
opal-assets = { path = "../assets" }
opal-c1 = { version = "0.1.0", path = "../c1" }
opal-dai = { version = "0.1.0", path = "../dai" }
opal-effects = { version = "0.1.0", path = "../effects" }
opal-ipc = { version = "0.1.0", path = "../ipc" }
opal-xlink = { version = "0.1.0", path = "../xlink" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
opal-v4l2 = { version = "0.1.0", path = "../v4l2" }

[target.'cfg(windows)'.dependencies]
opal-vcam = { version = "0.1.0", path = "../vcam" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation"] }
