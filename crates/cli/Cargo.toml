[package]
name = "opal-rs"
description = "Opal C1 tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opal-rs"
path = "src/main.rs"

# The .deb, built with `cargo xtask deb`: see "Release packages" in DEVELOPING.md.
[package.metadata.deb]
name = "opal-rs"
maintainer = "Tyler Zars <tyler@zars.me>"
copyright = "Tyler Zars"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """\
Host software for the Opal C1 webcam: boots the camera from RAM and runs it as a webcam with effects, through the \
"Opal C1 Virtual" camera. No Opal software is included: the camera files are copied out of the user's own Opal \
Composer disk image, which the control panel asks for on first run."""
section = "video"
priority = "optional"
depends = "$auto, systemd, udev, kmod"
recommends = "zenity, pkexec"
# Ubuntu's own kernels carry a signed v4l2loopback; the DKMS one would replace it with an unsigned build.
suggests = "v4l2loopback-dkms"
maintainer-scripts = "../../dist/deb/"
assets = [
    ["target/release/opal-rs", "usr/bin/", "755"],
    ["target/release/opal-rs-gui", "usr/bin/", "755"],
    ["target/release/opal-rs-tray", "usr/bin/", "755"],
    ["../../dist/70-opal-c1.rules", "usr/lib/udev/rules.d/", "644"],
    ["../../dist/v4l2loopback.conf", "usr/lib/modprobe.d/opal-rs-v4l2loopback.conf", "644"],
    ["../../dist/deb/opal-rs-modules.conf", "usr/lib/modules-load.d/opal-rs.conf", "644"],
    ["../../dist/deb/opal-rs.service", "usr/lib/systemd/user/", "644"],
    ["../../dist/opal-rs-tray.desktop", "etc/xdg/autostart/", "644"],
    ["../../dist/opal-rs.desktop", "usr/share/applications/", "644"],
    ["../../dist/deb/io.github.tylzars.opal-rs.policy", "usr/share/polkit-1/actions/", "644"],
    ["../../README.md", "usr/share/doc/opal-rs/", "644"],
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
opal-assets = { path = "../assets" }
opal-c1 = { path = "../c1" }
opal-dai = { path = "../dai" }
opal-effects = { path = "../effects" }
# The Windows virtual camera; Linux uses only its frame resizing.
opal-vcam = { path = "../vcam" }
opal-ipc = { path = "../ipc" }
opal-xlink = { path = "../xlink" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
opal-v4l2 = { path = "../v4l2" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation"] }
