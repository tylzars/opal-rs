[package]
name = "opal-rs"
description = "Opal C1 tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opal-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
opal-assets = { path = "../assets" }
opal-c1 = { version = "0.1.0", path = "../c1" }
opal-dai = { version = "0.1.0", path = "../dai" }
opal-effects = { version = "0.1.0", path = "../effects" }
opal-xlink = { version = "0.1.0", path = "../xlink" }

[target.'cfg(unix)'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "0.2.190"
opal-v4l2 = { version = "0.1.0", path = "../v4l2" }
